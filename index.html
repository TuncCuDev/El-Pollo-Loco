<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/responsive.style.css">
    <title>El Pollo Loco</title>
    <link rel="shortcut icon" href="assets/images/3_enemies_chicken/chicken_normal/1_walk/1_w.png" type="image/x-icon">

    <script src="models/drawable-object.class.js"></script>
    <script src="models/moveable-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/coins-bar.class.js"></script>
    <script src="models/bottle-bar.class.js"></script>
    <script src="models/endboss-status-bar.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/collectable-object.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="js/collectables.js"></script>

    <script src="levels/level1.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/world.second.js"></script>
    <script src="js/game.js"></script>
</head>

<body onload="init()">
    <div id="fullscreen">
        <h1>El Pollo Loco </h1>
        <canvas id="canvas" class="container" width="720" height="480">

        </canvas>
        <button id="playButton" onclick="startGame()">Play</button>
        <button id="overlayImpressum" onclick="openImpressum()">Impressum</button>

        <div class="button-line">
            <button onclick="toggleSound()">
                <img id="soundIcon" src="assets/images/img/laut.png" alt="">
            </button>
            <button class="button-top" onclick="fullscreen()" id="fullscreenBtn">
                <img src="assets/images/img/vollbildbutton.png" alt=""> 
            </button>
            <button onclick="gameInformation()">
                <img class="button-top size" src="assets/images/img/infoicon.png" alt="Info">
            </button>
        </div>
    </div>

    <div id="impressumOverlay" class="container">
        <div class="impressum-content">
            <h2>Impressum</h2>
            <ul>
                <li><strong>Projekt:</strong> El Pollo Loco - Projektarbeit</li>
                <li><strong>Erstellt von:</strong> Tuncay</li>
                <li><strong>Kontakt:</strong> tuncayc@hotmail.de</li>
            </ul>
            <div class="button-impressum">
                <button onclick="closeImpressum()" class="btn-impressum">Schließen</button>
            </div>
        </div>
    </div>

    <div id="gameOverOverlay">
        <img src="./assets/images/9_intro_outro_screens/game_over/game over!.png" alt="Game Over">
        <div class="button-gameover">
            <button id="restartButton" onclick="restartGame()">New Game</button>
            <button id="menuButton" onclick="goToMenu()">Menu</button>
        </div>
    </div>

    <div id="youWinOverlay">
        <div class="overlay-bg"></div>
        <img src="./assets/images/9_intro_outro_screens/start/startscreen_2.png" alt="YouWin" class="overlay-img">
        <div class="overlay-text">YOU WIN!</div>
            <div class="button-youwin">
                <button id="menuButton" class="btn" onclick="goToMenu()">Menu</button>
            </div>
    </div>

    <div id="infoOverlay" class="overlay hidden">
        <div class="overlay-content">
            <h2>Controls</h2>
            <p>➡️ Right Arrow: Move right</p>
            <p>⬅️ Left Arrow: Move left</p>
            <p>⎵ Space: Jump</p>
            <p>🧴 D: Throw bottle</p>
            <button onclick="closeInfo()">Close</button>
        </div>
    </div>
    
    <div id="rotateMessage">
        <div class="rotate-box">
            <div class="phone"></div>
            <p>Bitte drehen Sie das Telefon in Querformat um!</p>
        </div>
    </div>

    <div id="mobileControls">
        <div class="left-side">
            <button id="btnLeft">⬅️</button>
            <button id="btnRight">➡️</button>
        </div>
        <div class="right-side">
            <button id="btnThrow">🧴</button>
            <button id="btnJump">⬆️</button>
        </div>
    </div>

</body>
</html>
